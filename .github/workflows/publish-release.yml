# Build, test and publish a GitHub release whenever the version in plugin.json
# changes (Flow Launcher's plugin manifest requires an automated release, and
# its updater picks new releases up by itself every few hours).
name: Publish Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  # Flow Launcher's embedded Python is 3.11; lib/ only holds pure-Python wheels anyway.
  python_ver: "3.11"
  zip_name: Flow.Launcher.Plugin.ScreenControl.zip

# Actions are pinned to commits: a moved tag can't change what publishes a release.
jobs:
  # Runs the code being tested, pull requests included: it can't write to the repository.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.python_ver }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).Version
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Bundle dependencies into lib/
        run: python build_plugin.py install-lib

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build and check the archive
        run: python build_plugin.py $env:zip_name

      - name: Extract this version's release notes
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python build_plugin.py notes $env:VERSION release_notes.md

      - name: Upload the archive to the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ScreenControl-${{ steps.version.outputs.version }}
          path: |
            ${{ env.zip_name }}
            release_notes.md

  # Can write, so it runs nothing from the repository: it only publishes what build made.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Is this version already released?
        id: released
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v$env:VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          "exists=$($LASTEXITCODE -eq 0)".ToLower() >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.released.outputs.exists != 'true'
        with:
          name: ScreenControl-${{ needs.build.outputs.version }}

      - name: Publish the release
        if: steps.released.outputs.exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: ScreenControl ${{ needs.build.outputs.version }}
          body_path: release_notes.md
          files: ${{ env.zip_name }}
